<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简单页面</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: #f4f6f8;
        color: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      main {
        max-width: 28rem;
        background: #fff;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      p {
        line-height: 1.6;
        color: #444;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      #msg {
        margin-top: 1rem;
        font-weight: 600;
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>你好，世界</h1>
      <p>这是一个简单的 HTML 页面示例，包含标题、段落和按钮。</p>
      <button type="button" id="btn">点我</button>
      <p id="msg" aria-live="polite"></p>
    </main>
    <script>
      document.getElementById("btn").addEventListener("click", function () {
        document.getElementById("msg").textContent = "按钮已点击！";
      });
    </script>
  </body>
</html>
