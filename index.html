<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人自我介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 650px;
            width: 100%;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);
            object-fit: cover;
            margin-bottom: 15px;
            background-color: #fff;
        }

        .name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #4a5568;
            border-left: 4px solid #667eea;
            padding-left: 10px;
            margin-bottom: 12px;
        }

        .bio-text {
            line-height: 1.7;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: #edf2f7;
            color: #4a5568;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }

        .skill-tag:hover {
            background: #667eea;
            color: white;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #4a5568;
            text-decoration: none;
        }

        .contact-item:hover {
            color: #667eea;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #f8fafc;
            border-top: 1px solid #edf2f7;
            font-size: 0.85rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="card">
        <header class="header">
            <img class="avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="头像">
            <h1 class="name">张三</h1>
            <p class="tagline">全栈开发工程师 / 技术爱好者</p>
        </header>

        <main class="content">
            <section class="section">
                <h2 class="section-title">关于我</h2>
                <p class="bio-text">
                    你好！我是一名热爱编程与创造的开发者，拥有 3 年 Web 开发经验。热衷于现代前端技术与后端架构设计，喜欢探索新技术并运用到实际项目中，追求写出干净、高效且易维护的代码。
                </p>
            </section>

            <section class="section">
                <h2 class="section-title">专业技能</h2>
                <div class="skills">
                    <span class="skill-tag">HTML5 / CSS3</span>
                    <span class="skill-tag">JavaScript / TypeScript</span>
                    <span class="skill-tag">React / Vue</span>
                    <span class="skill-tag">Node.js</span>
                    <span class="skill-tag">Python</span>
                    <span class="skill-tag">Git</span>
                    <span class="skill-tag">Docker</span>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">联系方式</h2>
                <div class="contact-info">
                    <a class="contact-item" href="mailto:example@email.com">
                        <span>📧</span> example@email.com
                    </a>
                    <a class="contact-item" href="tel:13800138000">
                        <span>📱</span> +86 138-0000-0000
                    </a>
                    <a class="contact-item" href="https://github.com" target="_blank" rel="noopener noreferrer">
                        <span>💻</span> github.com/yourname
                    </a>
                    <div class="contact-item">
                        <span>📍</span> 中国 · 北京
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            © 2026 张三. 保留所有权利.
        </footer>
    </div>
</body>
</html>
