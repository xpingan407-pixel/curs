# HZ anti-crawler / scan probe map (星语)
# 业务路径 /api/ /apiBiz/ /im /file/ 不因空 UA 单独封禁

map $request_uri $hz_block_uri {
    default 0;
    ~*\.env$ 1;
    ~*\.git 1;
    ~*wp-login\.php 1;
    ~*wp-admin 1;
    ~*phpmyadmin 1;
    ~*\.php$ 1;
    ~*mysqldump\.sql 1;
    ~*\.sql$ 1;
    ~*xxing\.png 1;
    ~*^/\.well-known/.*\.(php|jsp|py) 1;
    ~*/(administrator|manager|shell|setup\.php) 1;
}

map $http_user_agent $hz_block_ua {
    default 0;
    "" 0;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*masscan 1;
    ~*nmap 1;
    ~*zgrab 1;
    ~*censys 1;
    ~*keydrop 1;
    ~*onlyscans 1;
    ~*acunetix 1;
    ~*nessus 1;
    ~*dirbuster 1;
    ~*gobuster 1;
}

map "$hz_block_uri:$hz_block_ua" $hz_scan_drop {
    default 0;
    ~^1: 1;
    ~:1$ 1;
    ~^1:1$ 1;
}
